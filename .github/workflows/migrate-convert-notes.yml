# ONE-SHOT. Runs only on migrate/convert-notes; it and .github/migrate/ are
# deleted before that branch merges. Converts old-shape table notes to the
# doc-render shape (D-041). Skips anything it cannot convert losslessly and
# writes the full converted/skipped report into the commit message.
name: convert table notes (one-shot, D-041)
on:
  push:
    branches: ['migrate/convert-notes']
    paths: ['.github/workflows/migrate-convert-notes.yml']
permissions:
  contents: write
jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migrate/convert-notes
      - name: Convert
        run: |
          set -euo pipefail
          python3 .github/migrate/convert.py . hml-llc maw-documents uritp-people uritp-global-setup maw-budget > /tmp/report.json
          cat /tmp/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps
          git commit -m "Convert table notes to the doc-render shape (D-041)" -m "$(cat /tmp/report.json)"
          git push origin HEAD:migrate/convert-notes

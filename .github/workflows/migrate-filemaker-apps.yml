# ONE-SHOT. Runs only on the migrate/filemaker-apps branch and is deleted
# before that branch merges. Copies three FileMaker spec packages verbatim from
# the public ClickUp_apps repo into apps/ (maw-prose D-041), proves every file
# arrived, and commits the result to this same branch for review.
# A push made with GITHUB_TOKEN does not start another run, so it cannot loop.
name: migrate filemaker apps (one-shot, D-041)
on:
  push:
    branches: ['migrate/filemaker-apps']
    paths: ['.github/workflows/migrate-filemaker-apps.yml']
permissions:
  contents: write
jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migrate/filemaker-apps
      - name: Clone the source
        run: git clone --depth 1 https://github.com/mawizorek/ClickUp_apps.git /tmp/src
      - name: Copy and verify
        run: |
          set -euo pipefail
          SRC=$(git -C /tmp/src rev-parse --short HEAD)
          for app in maw-budget uritp-global-setup uritp-people; do
            if [ -e "apps/$app" ]; then echo "apps/$app already exists, refusing to overwrite"; exit 1; fi
            mkdir -p "apps/$app"
            cp -a "/tmp/src/filemaker/$app/." "apps/$app/"
            find "apps/$app" -name .DS_Store -delete
            want=$(find "/tmp/src/filemaker/$app" -type f ! -name .DS_Store | wc -l)
            got=$(find "apps/$app" -type f | wc -l)
            echo "$app: source $want files, copied $got"
            if [ "$want" != "$got" ]; then echo "COUNT MISMATCH in $app"; exit 1; fi
            ( cd "/tmp/src/filemaker/$app" && find . -type f ! -name .DS_Store -exec sha1sum {} + | sort -k2 ) > /tmp/a.txt
            ( cd "apps/$app" && find . -type f -exec sha1sum {} + | sort -k2 ) > /tmp/b.txt
            diff /tmp/a.txt /tmp/b.txt
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps
          git commit -m "Move maw-budget, uritp-global-setup, uritp-people from ClickUp_apps/filemaker@${SRC} (D-041)" -m "Verbatim copy, file count and sha1 of every file checked against the source. Conversion to the doc-render shape follows per app."
          git push origin HEAD:migrate/filemaker-apps

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HML_LLC Layout Viewer</title>
<!--
  PORTABLE LAYOUT RENDERER
  ========================
  Location: apps/hml-llc/viewer.html
  Purpose:  Discover all *.html render files in this app tree,
            present a dropdown, render the selected layout below.
  
  THEME-JOIN: papyrus (from OPEN-ME.md frontmatter)
  REPO: mawizorek/maw-prose
  APP-ROOT: apps/hml-llc/
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #1c1c1c;
  color: #f6f6f6;
  font-family: 'Gabarito', sans-serif;
  font-size: 15px;
}

.viewer-chrome {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: #2a2a2a;
  border-bottom: 1px solid #3a3a3a;
  flex-shrink: 0;
}

.toolbar-title {
  font-family: 'Gabarito', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.toolbar select {
  flex: 1;
  max-width: 420px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  background: #333;
  color: #f6f6f6;
  border: 1px solid #3a3a3a;
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
}
.toolbar select:focus {
  outline: none;
  border-color: #6a6;
}

.toolbar .status {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: #666;
  margin-left: auto;
  white-space: nowrap;
}

.toolbar .theme-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: #6a6;
  background: #333;
  border: 1px solid #6a6;
  border-radius: 4px;
  padding: 2px 6px;
  white-space: nowrap;
}

.render-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #222;
}

.render-area iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #1c1c1c;
}

.render-area .empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #555;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
}
.render-area .empty-state .arrow {
  font-size: 24px;
  animation: bounce 1.5s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1c1c1c;
  color: #888;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  z-index: 10;
}
</style>
</head>
<body>
<div class="viewer-chrome">

  <div class="toolbar">
    <span class="toolbar-title">HML_LLC Layouts</span>
    <select id="layout-picker" disabled>
      <option value="">scanning...</option>
    </select>
    <span class="theme-badge" id="theme-badge">theme: papyrus</span>
    <span class="status" id="status">loading</span>
  </div>

  <div class="render-area" id="render-area">
    <div class="empty-state" id="empty-state">
      <span class="arrow">&#8593;</span>
      <span>select a layout to render</span>
    </div>
    <iframe id="render-frame" style="display:none"></iframe>
    <div class="loading" id="loading" style="display:none">loading render...</div>
  </div>

</div>

<script>
(function() {
  var OWNER = 'mawizorek';
  var REPO = 'maw-prose';
  var APP_ROOT = 'apps/hml-llc';
  var SELF = 'viewer.html';
  var PAGES_BASE = 'https://mawizorek.github.io/maw-prose/';

  var picker = document.getElementById('layout-picker');
  var frame = document.getElementById('render-frame');
  var emptyState = document.getElementById('empty-state');
  var loading = document.getElementById('loading');
  var status = document.getElementById('status');

  function discoverLayouts() {
    var url = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/git/trees/main?recursive=1';
    return fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.tree) return [];
        return data.tree
          .filter(function(item) {
            return item.type === 'blob'
              && item.path.indexOf(APP_ROOT + '/') === 0
              && item.path.match(/\.html$/i)
              && item.path.indexOf(SELF) === -1;
          })
          .map(function(item) {
            var display = item.path.replace(APP_ROOT + '/', '');
            return { path: item.path, display: display };
          })
          .sort(function(a, b) { return a.display.localeCompare(b.display); });
      });
  }

  function populatePicker(layouts) {
    picker.innerHTML = '';
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '\u2014 select layout (' + layouts.length + ' found) \u2014';
    picker.appendChild(placeholder);

    var groups = {};
    layouts.forEach(function(l) {
      var parts = l.display.split('/');
      var folder = parts.length > 1 ? parts[0] : '(root)';
      if (!groups[folder]) groups[folder] = [];
      groups[folder].push(l);
    });

    Object.keys(groups).sort().forEach(function(folder) {
      var optgroup = document.createElement('optgroup');
      optgroup.label = folder;
      groups[folder].forEach(function(l) {
        var opt = document.createElement('option');
        opt.value = l.path;
        opt.textContent = l.display;
        optgroup.appendChild(opt);
      });
      picker.appendChild(optgroup);
    });

    picker.disabled = false;
    status.textContent = layouts.length + ' layouts';
  }

  function renderLayout(path) {
    if (!path) {
      frame.style.display = 'none';
      emptyState.style.display = 'flex';
      loading.style.display = 'none';
      return;
    }

    emptyState.style.display = 'none';
    loading.style.display = 'flex';
    frame.style.display = 'none';

    // Use Pages URL directly (same origin, no CORS)
    var pageUrl = PAGES_BASE + path;

    frame.onload = function() {
      loading.style.display = 'none';
      frame.style.display = 'block';
      status.textContent = path.replace(APP_ROOT + '/', '');
    };
    frame.onerror = function() {
      loading.style.display = 'none';
      emptyState.style.display = 'flex';
      status.textContent = 'error';
    };
    frame.src = pageUrl;
  }

  picker.addEventListener('change', function() {
    renderLayout(picker.value);
  });

  discoverLayouts()
    .then(populatePicker)
    .catch(function(err) {
      status.textContent = 'scan failed';
      picker.innerHTML = '<option>error: ' + err.message + '</option>';
    });

  var params = new URLSearchParams(window.location.search);
  var preselect = params.get('layout');
  if (preselect) {
    var fullPath = preselect.indexOf(APP_ROOT) === 0 ? preselect : APP_ROOT + '/' + preselect;
    discoverLayouts().then(function() {
      picker.value = fullPath;
      renderLayout(fullPath);
    });
  }

})();
</script>
</body>
</html>

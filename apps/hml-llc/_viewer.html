<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HML_LLC — Layout Viewer</title>
<!--
  PORTABLE LAYOUT RENDERER
  ========================
  Location: apps/hml-llc/_viewer.html
  Purpose:  Discover all *.html render files in this app tree,
            present a dropdown, render the selected layout below.
  
  Theme cross-reference: resolve.js is loaded HERE at the viewer level.
  Future: individual render HTMLs will strip their own theme imports
  and this viewer injects tokens into the iframe, making the theme
  a single cross-referenced concern at the app level.

  HOW IT WORKS:
  1. On load, hits GitHub Contents API recursively for this app folder
  2. Filters for *.html files (excluding itself: _viewer.html)
  3. Populates the dropdown
  4. On selection, fetches raw HTML and renders in the iframe
  5. Theme tokens are applied to the viewer chrome AND injected into
     the iframe document for cross-reference theming (v2 target)

  THEME-JOIN: papyrus (from OPEN-ME.md frontmatter)
  REPO: mawizorek/maw-prose
  APP-ROOT: apps/hml-llc/
-->

<!-- Fonts: papyrus typography vector -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- THEME RESOLVER: cross-reference source of truth -->
<script src="https://cdn.jsdelivr.net/gh/mawizorek/ClickUp_apps@main/shared/themes/resolve.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg, #1c1c1c);
  color: var(--text, #f6f6f6);
  font-family: var(--font-body, 'Gabarito', sans-serif);
  font-size: var(--fs-body, 15px);
}

.viewer-chrome {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* === TOOLBAR === */
.toolbar {
  display: flex;
  align-items: center;
  gap: var(--gap-md, 12px);
  padding: var(--pad-cell, 8px) var(--pad-card, 16px);
  background: var(--surface-1, #2a2a2a);
  border-bottom: var(--border-w, 1px) solid var(--border, #3a3a3a);
  flex-shrink: 0;
}

.toolbar-title {
  font-family: var(--font-display, 'Gabarito', sans-serif);
  font-size: var(--fs-sm, 13px);
  font-weight: 600;
  color: var(--text-soft, #aaa);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.toolbar select {
  flex: 1;
  max-width: 420px;
  font-family: var(--font-mono, 'IBM Plex Mono', monospace);
  font-size: var(--fs-sm, 13px);
  background: var(--field, #333);
  color: var(--text, #f6f6f6);
  border: var(--border-w, 1px) solid var(--border, #3a3a3a);
  border-radius: var(--radius, 4px);
  padding: 4px 8px;
  cursor: pointer;
}
.toolbar select:focus {
  outline: none;
  border-color: var(--accent, #6a6);
}

.toolbar .status {
  font-family: var(--font-mono, 'IBM Plex Mono', monospace);
  font-size: var(--fs-xs, 11px);
  color: var(--text-faint, #666);
  margin-left: auto;
  white-space: nowrap;
}

.toolbar .theme-badge {
  font-family: var(--font-mono, 'IBM Plex Mono', monospace);
  font-size: var(--fs-xs, 11px);
  color: var(--accent, #6a6);
  background: var(--surface-2, #333);
  border: var(--border-w, 1px) solid var(--accent, #6a6);
  border-radius: var(--radius, 4px);
  padding: 2px 6px;
  white-space: nowrap;
}

/* === RENDER AREA === */
.render-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--surface-2, #222);
}

.render-area iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: var(--bg, #1c1c1c);
}

.render-area .empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-faint, #555);
  font-family: var(--font-mono, 'IBM Plex Mono', monospace);
  font-size: var(--fs-sm, 13px);
}
.render-area .empty-state .arrow {
  font-size: 24px;
  animation: bounce 1.5s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* === LOADING === */
.loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg, #1c1c1c);
  color: var(--text-soft, #888);
  font-family: var(--font-mono, 'IBM Plex Mono', monospace);
  font-size: var(--fs-sm, 13px);
  z-index: 10;
}
</style>
</head>
<body>
<div class="viewer-chrome">

  <!-- TOOLBAR -->
  <div class="toolbar">
    <span class="toolbar-title">HML_LLC Layouts</span>
    <select id="layout-picker" disabled>
      <option value="">scanning...</option>
    </select>
    <span class="theme-badge" id="theme-badge">theme: papyrus</span>
    <span class="status" id="status">loading</span>
  </div>

  <!-- RENDER AREA -->
  <div class="render-area" id="render-area">
    <div class="empty-state" id="empty-state">
      <span class="arrow">&#8593;</span>
      <span>select a layout to render</span>
    </div>
    <iframe id="render-frame" style="display:none"></iframe>
    <div class="loading" id="loading" style="display:none">loading render...</div>
  </div>

</div>

<script>
(function() {
  // === CONFIG ===
  var OWNER = 'mawizorek';
  var REPO = 'maw-prose';
  var APP_ROOT = 'apps/hml-llc';
  var SELF = '_viewer.html';
  var THEME_SLUG = 'papyrus'; // from OPEN-ME.md frontmatter
  var THEME_REPO = 'ClickUp_apps';
  var THEME_BASE = 'https://cdn.jsdelivr.net/gh/' + OWNER + '/' + THEME_REPO + '@main/shared/themes/';

  // === DOM ===
  var picker = document.getElementById('layout-picker');
  var frame = document.getElementById('render-frame');
  var emptyState = document.getElementById('empty-state');
  var loading = document.getElementById('loading');
  var status = document.getElementById('status');

  // === DISCOVER HTML FILES ===
  // Uses GitHub Git Trees API (recursive) to find all .html files under APP_ROOT
  function discoverLayouts() {
    var url = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/git/trees/main?recursive=1';
    return fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.tree) return [];
        return data.tree
          .filter(function(item) {
            return item.type === 'blob'
              && item.path.indexOf(APP_ROOT + '/') === 0
              && item.path.match(/\.html$/i)
              && item.path.indexOf(SELF) === -1;
          })
          .map(function(item) {
            // Strip the app root prefix for display
            var display = item.path.replace(APP_ROOT + '/', '');
            return { path: item.path, display: display };
          })
          .sort(function(a, b) { return a.display.localeCompare(b.display); });
      });
  }

  // === POPULATE DROPDOWN ===
  function populatePicker(layouts) {
    picker.innerHTML = '';
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '— select layout (' + layouts.length + ' found) —';
    picker.appendChild(placeholder);

    // Group by subfolder
    var groups = {};
    layouts.forEach(function(l) {
      var parts = l.display.split('/');
      var folder = parts.length > 1 ? parts[0] : '(root)';
      if (!groups[folder]) groups[folder] = [];
      groups[folder].push(l);
    });

    Object.keys(groups).sort().forEach(function(folder) {
      var optgroup = document.createElement('optgroup');
      optgroup.label = folder;
      groups[folder].forEach(function(l) {
        var opt = document.createElement('option');
        opt.value = l.path;
        opt.textContent = l.display;
        optgroup.appendChild(opt);
      });
      picker.appendChild(optgroup);
    });

    picker.disabled = false;
    status.textContent = layouts.length + ' layouts';
  }

  // === RENDER SELECTED LAYOUT ===
  function renderLayout(path) {
    if (!path) {
      frame.style.display = 'none';
      emptyState.style.display = 'flex';
      loading.style.display = 'none';
      return;
    }

    emptyState.style.display = 'none';
    loading.style.display = 'flex';
    frame.style.display = 'none';

    // Fetch raw content via jsdelivr CDN (avoids API rate limits + CORS)
    var rawUrl = 'https://cdn.jsdelivr.net/gh/' + OWNER + '/' + REPO + '@main/' + path;

    fetch(rawUrl)
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(html) {
        // === THEME CROSS-REFERENCE (v2 prep) ===
        // Rewrite resolve.js src to use CDN path (fixes CORS)
        html = html.replace(
          /src="[^"]*resolve\.js"/g,
          'src="' + THEME_BASE + 'resolve.js"'
        );

        // Write into iframe
        loading.style.display = 'none';
        frame.style.display = 'block';
        frame.srcdoc = html;
        status.textContent = path.replace(APP_ROOT + '/', '');
      })
      .catch(function(err) {
        loading.style.display = 'none';
        emptyState.style.display = 'flex';
        emptyState.querySelector('span:last-child').textContent = 'failed: ' + err.message;
        status.textContent = 'error';
      });
  }

  // === EVENTS ===
  picker.addEventListener('change', function() {
    renderLayout(picker.value);
  });

  // === INIT ===
  // Apply theme to viewer chrome
  if (window.THEMES && window.THEMES.ready) {
    window.THEMES.ready.then(function() {
      return window.THEMES.applyTheme(THEME_SLUG);
    }).catch(function() {});
  }

  // Discover and populate
  discoverLayouts()
    .then(populatePicker)
    .catch(function(err) {
      status.textContent = 'scan failed';
      picker.innerHTML = '<option>error: ' + err.message + '</option>';
    });

  // === URL PARAM SUPPORT ===
  // ?layout=layouts/form-loan-detail-render.html
  var params = new URLSearchParams(window.location.search);
  var preselect = params.get('layout');
  if (preselect) {
    var fullPath = preselect.indexOf(APP_ROOT) === 0 ? preselect : APP_ROOT + '/' + preselect;
    // Wait for picker to populate, then select + render
    discoverLayouts().then(function() {
      picker.value = fullPath;
      renderLayout(fullPath);
    });
  }

})();
</script>
</body>
</html>

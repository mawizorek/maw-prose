<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doc Reader</title>
<!--
  PORTABLE DOC READER  (FMP app documentation)
  ============================================
  Renders the MARKDOWN doc set of an FMP app package: OPEN-ME, schema notes,
  data standards, build spec, and every page in tables/ and relationships/.
  Sidebar nav, deep links, in-tree .md links resolve inside the reader.

  ZERO CONFIG. Derives owner / repo / app-root from the GitHub Pages URL.
  Discovery: GitHub trees API (one call). Bodies: same-origin fetch of the
  deployed file beside it, so what renders IS what shipped.

  DISTINCT FROM TWO OTHER THINGS, deliberately (ruled 2026-09-16):
    - viewer.html            = LAYOUT renderer + theme sandbox. Reads *.html
                               wireframe renders. Not documentation.
    - doc-render-engine      = the markdown PUBLISHER (MkDocs). Builds a site.
                               This reads a repo tree live; it publishes nothing.

  NO HARDCODED APP ROOT. If detection fails it says so and renders nothing --
  it will never silently serve another app's documentation.
  REQUIREMENTS: GitHub Pages enabled, .nojekyll in repo root.
  PORTABILITY: copy into any app folder in any Pages-enabled repo. Done.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1c1c1c;color:#f6f6f6;font-family:'Gabarito',sans-serif;font-size:15px}
.chrome{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#2a2a2a;border-bottom:1px solid #3a3a3a;flex-shrink:0;flex-wrap:wrap}
.t-title{font-size:13px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6a6;background:#333;border:1px solid #6a6;border-radius:4px;padding:2px 6px;white-space:nowrap}
.badge.warn{color:#e0a84f;border-color:#e0a84f}
.badge.bad{color:#e06a5f;border-color:#e06a5f}
.status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#666;margin-left:auto;white-space:nowrap}
.menu-btn{display:none;background:#333;color:#f6f6f6;border:1px solid #3a3a3a;border-radius:4px;padding:4px 10px;font-family:inherit;font-size:13px;cursor:pointer}
.body{flex:1;display:flex;overflow:hidden}
nav{width:280px;flex-shrink:0;background:#232323;border-right:1px solid #3a3a3a;overflow-y:auto;padding:12px 0}
nav .group{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#666;padding:12px 16px 4px}
nav a{display:block;padding:5px 16px;color:#c8c8c8;text-decoration:none;font-size:14px;border-left:2px solid transparent}
nav a:hover{background:#2a2a2a;color:#fff}
nav a.on{background:#2f2f2f;color:#fff;border-left-color:#6a6;font-weight:600}
main{flex:1;overflow-y:auto;padding:32px 40px 96px}
.doc{max-width:920px;margin:0 auto}
.doc h1{font-size:30px;font-weight:700;margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid #3a3a3a}
.doc h2{font-size:21px;font-weight:600;margin:32px 0 12px;color:#fff}
.doc h3{font-size:17px;font-weight:600;margin:24px 0 8px;color:#e8e8e8}
.doc p{margin:0 0 14px;line-height:1.65;color:#dcdcdc}
.doc ul,.doc ol{margin:0 0 14px 22px}
.doc li{margin-bottom:6px;line-height:1.6;color:#dcdcdc}
.doc a{color:#7ab87a;text-decoration:none;border-bottom:1px solid rgba(122,184,122,.35)}
.doc a:hover{color:#9ed69e}
.doc strong{color:#fff;font-weight:600}
.doc em{color:#e2e2e2}
.doc del{color:#7a7a7a}
.doc code{font-family:'IBM Plex Mono',monospace;font-size:.88em;background:#2e2e2e;color:#e0c98a;padding:1px 5px;border-radius:3px}
.doc pre{background:#242424;border:1px solid #3a3a3a;border-radius:6px;padding:14px 16px;overflow-x:auto;margin:0 0 16px}
.doc pre code{background:none;color:#c9d6c9;padding:0;font-size:12.5px;line-height:1.5}
.doc blockquote{border-left:3px solid #4a4a4a;padding:2px 0 2px 14px;margin:0 0 14px;color:#a8a8a8}
.doc hr{border:none;border-top:1px solid #3a3a3a;margin:28px 0}
.doc table{border-collapse:collapse;width:100%;margin:0 0 18px;font-size:13.5px}
.doc th,.doc td{border:1px solid #3a3a3a;padding:7px 10px;text-align:left;vertical-align:top;line-height:1.5}
.doc th{background:#2e2e2e;color:#fff;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.doc td{color:#dcdcdc}
.doc tr:nth-child(even) td{background:#212121}
.fm{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#242424;border:1px solid #3a3a3a;border-left:3px solid #6a6;border-radius:4px;padding:10px 12px;margin:0 0 20px;color:#8fae8f;white-space:pre-wrap}
.msg{max-width:720px;margin:64px auto;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#888;line-height:1.7}
.msg b{color:#e06a5f}
@media (max-width:820px){
  .menu-btn{display:block}
  nav{position:absolute;top:0;bottom:0;left:0;z-index:20;box-shadow:0 0 30px rgba(0,0,0,.6);transform:translateX(-100%);transition:transform 180ms}
  nav.open{transform:none}
  .body{position:relative}
  main{padding:20px 18px 80px}
}
</style>
</head>
<body>
<div class="chrome">
  <div class="toolbar">
    <button class="menu-btn" id="menu-btn">&#9776;</button>
    <span class="t-title" id="title">Docs</span>
    <span class="badge" id="theme-badge" style="display:none"></span>
    <span class="status" id="status">loading</span>
  </div>
  <div class="body">
    <nav id="nav"></nav>
    <main><div class="doc" id="doc"><div class="msg">reading the tree...</div></div></main>
  </div>
</div>
<script>
(function(){
  var OWNER,REPO,ROOT,SELF=location.pathname.split('/').pop()||'docs-viewer.html';
  var host=location.hostname,segs;
  if(host.indexOf('.github.io')>0){
    OWNER=host.split('.github.io')[0];
    segs=location.pathname.replace(/^\//,'').replace(/\/$/,'').split('/');
    REPO=segs[0];segs=segs.slice(1);segs.pop();ROOT=segs.join('/');
  }
  var nav=document.getElementById('nav'),doc=document.getElementById('doc'),
      status=document.getElementById('status'),title=document.getElementById('title'),
      tbadge=document.getElementById('theme-badge');

  // ---- no silent wrong content ----
  if(!OWNER||!REPO){
    doc.innerHTML='<div class="msg"><b>Cannot determine which app this is.</b><br><br>'+
      'This reader derives owner, repo and app root from a GitHub Pages URL '+
      '(<code>{owner}.github.io/{repo}/{path}/</code>). It is deliberately NOT given a '+
      'hardcoded fallback, because a documentation reader that guesses its own app '+
      'would silently render another app&rsquo;s schema as if it were this one.<br><br>'+
      'Open it through GitHub Pages.</div>';
    status.textContent='no context';status.style.color='#e06a5f';return;
  }
  var folder=(ROOT.split('/').pop()||REPO);
  title.textContent=folder.replace(/-/g,' ').toUpperCase()+' Docs';
  document.title=folder+' | Doc Reader';

  // ================= MARKDOWN =================
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    var code=[];
    s=s.replace(/`([^`]+)`/g,function(m,c){code.push(c);return '\u0001'+(code.length-1)+'\u0001';});
    s=esc(s);
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2">');
    s=s.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
    s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
    return s.replace(/\u0001(\d+)\u0001/g,function(m,i){return '<code>'+esc(code[+i])+'</code>';});
  }
  function cells(line){
    var t=line.trim().replace(/^\|/,'').replace(/\|$/,'');
    return t.split('|').map(function(c){return c.trim();});
  }
  function isDivider(l){return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)&&l.indexOf('-')>-1;}

  function render(md){
    var out='',fm='',lines,i=0,L;
    lines=md.replace(/\r\n/g,'\n').split('\n');
    // frontmatter
    if(lines[0]==='---'){
      var j=1,buf=[];
      while(j<lines.length&&lines[j]!=='---'){buf.push(lines[j]);j++;}
      if(j<lines.length){fm=buf.join('\n');i=j+1;}
    }
    if(fm){
      var th=/(^|\n)theme:\s*(\S+)/.exec(fm);
      if(th){tbadge.textContent='theme: '+th[2];tbadge.style.display='';
        if(th[2]==='default-theme')tbadge.className='badge warn';}
      out+='<div class="fm">'+esc(fm.trim())+'</div>';
    }
    var para=[],list=null;
    function flushPara(){if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[];}}
    function flushList(){if(list){out+='</'+list+'>';list=null;}}
    function flushAll(){flushPara();flushList();}

    for(;i<lines.length;i++){
      L=lines[i];
      if(/^```/.test(L)){
        flushAll();var code=[];i++;
        while(i<lines.length&&!/^```/.test(lines[i])){code.push(lines[i]);i++;}
        out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';continue;
      }
      if(!L.trim()){flushAll();continue;}
      var h=/^(#{1,6})\s+(.*)$/.exec(L);
      if(h){flushAll();var n=h[1].length;out+='<h'+n+'>'+inline(h[2])+'</h'+n+'>';continue;}
      if(/^\s*([-*_])\s*\1\s*\1[-*_\s]*$/.test(L)){flushAll();out+='<hr>';continue;}
      if(L.indexOf('|')>-1&&i+1<lines.length&&isDivider(lines[i+1])){
        flushAll();
        var head=cells(L);i+=2;
        out+='<table><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr>';
        while(i<lines.length&&lines[i].indexOf('|')>-1&&lines[i].trim()){
          out+='<tr>'+cells(lines[i]).map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';
          i++;
        }
        i--;out+='</table>';continue;
      }
      if(/^\s*>\s?/.test(L)){
        flushAll();var q=[];
        while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}
        i--;out+='<blockquote>'+inline(q.join(' '))+'</blockquote>';continue;
      }
      var li=/^(\s*)([-*+]|\d+\.)\s+(.*)$/.exec(L);
      if(li){
        flushPara();
        var want=/^\d/.test(li[2])?'ol':'ul';
        if(list&&list!==want){flushList();}
        if(!list){out+='<'+want+'>';list=want;}
        var txt=li[3];
        while(i+1<lines.length&&lines[i+1].trim()&&!/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i+1])&&!/^#{1,6}\s/.test(lines[i+1])&&lines[i+1].indexOf('|')===-1&&!/^```/.test(lines[i+1])){
          txt+=' '+lines[i+1].trim();i++;
        }
        out+='<li>'+inline(txt)+'</li>';continue;
      }
      flushList();para.push(L.trim());
    }
    flushAll();
    return out;
  }

  // ================= NAV ORDER =================
  var ROOT_ORDER=['OPEN-ME.md','README.md','schema-notes.md','design-decisions.md',
                  'data-standards.md','next-build-spec.md','changelog.md'];
  function rank(name){var k=ROOT_ORDER.indexOf(name);return k===-1?99:k;}

  var pages=[];
  function buildNav(){
    var groups={};
    pages.forEach(function(p){
      var parts=p.rel.split('/'),g=parts.length>1?parts[0]:'(root)';
      (groups[g]=groups[g]||[]).push(p);
    });
    var keys=Object.keys(groups).sort(function(a,b){
      if(a==='(root)')return -1;if(b==='(root)')return 1;return a.localeCompare(b);
    });
    var html='';
    keys.forEach(function(g){
      var items=groups[g].sort(function(a,b){
        var ra=rank(a.rel),rb=rank(b.rel);
        return ra!==rb?ra-rb:a.rel.localeCompare(b.rel);
      });
      html+='<div class="group">'+esc(g)+'</div>';
      items.forEach(function(p){
        var label=p.rel.split('/').pop().replace(/\.md$/,'');
        html+='<a href="#'+encodeURIComponent(p.rel)+'" data-rel="'+esc(p.rel)+'">'+esc(label)+'</a>';
      });
    });
    nav.innerHTML=html;
  }

  function mark(rel){
    var as=nav.querySelectorAll('a');
    for(var i=0;i<as.length;i++)as[i].className=(as[i].getAttribute('data-rel')===rel)?'on':'';
  }

  // relative .md links inside a page navigate the reader
  function wireLinks(rel){
    var base=rel.split('/').slice(0,-1);
    var as=doc.querySelectorAll('a');
    for(var i=0;i<as.length;i++){
      var href=as[i].getAttribute('href')||'';
      if(/^(https?:|mailto:|#)/.test(href))continue;
      if(!/\.md(#.*)?$/i.test(href))continue;
      var parts=base.slice(),bits=href.split('#')[0].split('/');
      bits.forEach(function(b){
        if(b==='.'||b==='')return;
        if(b==='..')parts.pop();else parts.push(b);
      });
      as[i].setAttribute('href','#'+encodeURIComponent(parts.join('/')));
    }
  }

  function show(rel){
    tbadge.style.display='none';tbadge.className='badge';
    doc.innerHTML='<div class="msg">loading '+esc(rel)+'...</div>';
    status.textContent=rel;
    var depth=SELF?0:0; // reader sits at the app root; rel is app-root-relative
    fetch('./'+rel.split('/').map(encodeURIComponent).join('/')+'?t='+Date.now())
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
      .then(function(md){doc.innerHTML=render(md);wireLinks(rel);mark(rel);window.scrollTo(0,0);
        document.querySelector('main').scrollTop=0;nav.classList.remove('open');})
      .catch(function(e){
        doc.innerHTML='<div class="msg"><b>Could not load '+esc(rel)+'</b><br><br>'+
          'The tree lists it, so the file exists at HEAD. A failure here means GitHub Pages '+
          'has not published this path yet, or is serving a cached tree. '+
          '('+esc(String(e.message||e))+')</div>';
        status.textContent='load failed';
      });
  }

  function route(){
    var rel=decodeURIComponent((location.hash||'').replace(/^#/,''));
    if(!rel){rel=(pages[0]||{}).rel;}
    if(rel)show(rel);
  }

  document.getElementById('menu-btn').addEventListener('click',function(){nav.classList.toggle('open');});
  window.addEventListener('hashchange',route);

  // ================= DISCOVERY =================
  fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/git/trees/main?recursive=1')
    .then(function(r){if(!r.ok)throw new Error('trees '+r.status);return r.json();})
    .then(function(data){
      if(!data.tree)throw new Error('no tree');
      var prefix=ROOT?ROOT+'/':'';
      pages=data.tree.filter(function(it){
        return it.type==='blob'&&it.path.indexOf(prefix)===0&&/\.md$/i.test(it.path);
      }).map(function(it){return {path:it.path,rel:it.path.slice(prefix.length)};});
      if(!pages.length){
        doc.innerHTML='<div class="msg"><b>No markdown pages under '+esc(prefix||'/')+'</b><br><br>'+
          'This reader only renders <code>.md</code>. If you are looking for layout '+
          'wireframe renders, that is <code>viewer.html</code> &mdash; a different tool.</div>';
        status.textContent='0 pages';return;
      }
      buildNav();
      status.textContent=pages.length+' pages';
      route();
    })
    .catch(function(e){
      doc.innerHTML='<div class="msg"><b>Could not read the repo tree.</b><br><br>'+
        'Discovery uses one unauthenticated GitHub API call, which is rate limited to 60 per '+
        'hour per IP. If you have been hammering it, wait. Otherwise the repo or branch name '+
        'derived from this URL is wrong: <code>'+esc(OWNER+'/'+REPO)+'</code> at '+
        '<code>'+esc(ROOT||'(root)')+'</code>.<br><br>('+esc(String(e.message||e))+')</div>';
      status.textContent='discovery failed';status.style.color='#e06a5f';
    });
})();
</script>
</body>
</html>
